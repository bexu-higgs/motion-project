<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YEMELBAI FILMS × VeoSeeBot × Ziyo Fest AI — интро</title>
<style>
  @font-face { font-family: "InterDisplay"; font-weight: 200; src: url("fonts/InterDisplay-ExtraLight.otf") format("opentype"); }
  @font-face { font-family: "InterDisplay"; font-weight: 300; src: url("fonts/InterDisplay-Light.otf") format("opentype"); }
  @font-face { font-family: "InterDisplay"; font-weight: 600; src: url("fonts/InterDisplay-SemiBold.otf") format("opentype"); }
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; overflow: hidden;
               font: 14px/1.4 system-ui, sans-serif; }
  body.preview { display: flex; align-items: center; justify-content: center; }
  body.preview canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; cursor: pointer; }
  #hud { position: fixed; left: 16px; right: 16px; bottom: 12px; display: none; gap: 12px; align-items: center; }
  body.preview #hud { display: flex; }
  #bar { flex: 1; height: 4px; background: #222; border-radius: 2px; cursor: pointer; position: relative; }
  #fill { position: absolute; inset: 0 auto 0 0; width: 0; background: #888; border-radius: 2px; }
  #hint { opacity: .6; white-space: nowrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="hint">Басу / Space — ойнату</span><div id="bar"><div id="fill"></div></div><span id="tc">0.00</span></div>
<audio id="snd" src="output/intro_audio.wav" preload="auto"></audio>
<script src="timeline.js"></script>
<script src="assets/logo.js"></script>
<script src="assets/ziyo.js"></script>
<script>
"use strict";
const T = window.TIMELINE;
const W = T.width, H = T.height, CX = W / 2, CY = H / 2;
const RENDER = new URLSearchParams(location.search).has("render");

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const easeInOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeInCubic = x => x * x * x;
const easeInQuad = x => x * x;
const easeOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
// 0 before t0, 1 at t0, then exponential decay with time-constant tau
const pulse = (t, t0, tau) => t < t0 ? 0 : Math.exp(-(t - t0) / tau);
const wobble = (x) => Math.sin(x * 1.7) * Math.sin(x * 2.9 + 1.3) + 0.5 * Math.sin(x * 5.3 + 0.7);
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- canvases ---------- */
const INK = "rgb(236,232,225)";
const ink = a => `rgba(236,232,225,${a})`;
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const canvas = document.getElementById("c");
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext("2d");
const layer = mk(W, H), lctx = layer.getContext("2d");          // all bright elements of the frame
const glowSrc = mk(W, H), gctx = glowSrc.getContext("2d");      // extra light that only feeds the glow
const half = mk(W / 2, H / 2), hctx = half.getContext("2d");
const halfB = mk(W / 2, H / 2), hbctx = halfB.getContext("2d");
const tint = mk(W, H), tctx = tint.getContext("2d");
let bg, vignette, ambient, streak, grain = [], sweepCv, sctx;

const font = (weight, size) => `${weight} ${size}px "InterDisplay"`;
const capCache = {};
function capHeight(c, weight, size) {
  const k = weight + "/" + size;
  if (!(k in capCache)) { c.font = font(weight, size); capCache[k] = c.measureText("H").actualBoundingBoxAscent; }
  return capCache[k];
}
function layoutTracked(c, text, weight, size, tracking) {
  c.font = font(weight, size);
  const chars = [...text];
  const widths = chars.map(ch => c.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + tracking * (chars.length - 1);
  return { chars, widths, total };
}
// Draws letter-spaced text centred on (cx, cy) (cy = optical centre of the capitals).
function drawTracked(c, text, weight, size, tracking, cx, cy, alpha, perChar) {
  if (alpha <= 0.001) return layoutTracked(c, text, weight, size, tracking).total;
  const L = layoutTracked(c, text, weight, size, tracking);
  const cap = capHeight(c, weight, size);
  const n = L.chars.length;
  let x = cx - L.total / 2;
  c.save();
  c.textAlign = "left"; c.textBaseline = "alphabetic"; c.fillStyle = INK;
  for (let i = 0; i < n; i++) {
    const o = perChar ? perChar(i, n) : {};
    const a = alpha * (o.alpha ?? 1);
    if (a > 0.002) {
      c.globalAlpha = a;
      c.filter = (o.blur || 0) > 0.08 ? `blur(${o.blur.toFixed(2)}px)` : "none";
      c.fillText(L.chars[i], x + (o.dx || 0), cy + cap / 2 + (o.dy || 0));
    }
    x += L.widths[i] + tracking;
  }
  c.restore();
  return L.total;
}
function hLine(c, cx, cy, halfW, thick, alpha) {
  if (alpha <= 0.002 || halfW < 0.5) return;
  const g = c.createLinearGradient(cx - halfW, 0, cx + halfW, 0);
  g.addColorStop(0, ink(0)); g.addColorStop(0.18, ink(alpha)); g.addColorStop(0.82, ink(alpha)); g.addColorStop(1, ink(0));
  c.fillStyle = g; c.fillRect(cx - halfW, cy - thick / 2, halfW * 2, thick);
}
function dot(c, x, y, r, alpha) {
  if (alpha <= 0.002) return;
  c.save(); c.globalAlpha = alpha; c.fillStyle = INK; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); c.restore();
}
function ring(c, x, y, r, width, alpha) {
  if (alpha <= 0.002 || r <= 0) return;
  c.save(); c.globalAlpha = alpha; c.strokeStyle = INK; c.lineWidth = width;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.stroke(); c.restore();
}

/* ---------- static assets ---------- */
const GRAIN_SCALE = 2.5;   // grain particle size in px
const STUDIO = { weight: 600, size: 64 };
function buildAssets() {
  bg = mk(W, H); { const c = bg.getContext("2d");
    const g = c.createRadialGradient(CX, CY, 0, CX, CY, W * 0.62);
    g.addColorStop(0, "#09090b"); g.addColorStop(1, "#000000");
    c.fillStyle = g; c.fillRect(0, 0, W, H); }
  vignette = mk(W, H); { const c = vignette.getContext("2d");
    const g = c.createRadialGradient(CX, CY, H * 0.35, CX, CY, W * 0.62);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,0.6)");
    c.fillStyle = g; c.fillRect(0, 0, W, H); }
  ambient = mk(W, H); { const c = ambient.getContext("2d");
    const g = c.createRadialGradient(CX, CY, 0, CX, CY, W * 0.45);
    g.addColorStop(0, "rgba(255,244,228,0.22)"); g.addColorStop(1, "rgba(255,244,228,0)");
    c.fillStyle = g; c.fillRect(0, 0, W, H); }
  // anamorphic streak
  streak = mk(W, 120); { const c = streak.getContext("2d");
    const g = c.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, "rgba(170,198,255,0)"); g.addColorStop(0.35, "rgba(190,212,255,0.35)");
    g.addColorStop(0.5, "rgba(225,235,255,1)"); g.addColorStop(0.65, "rgba(190,212,255,0.35)"); g.addColorStop(1, "rgba(170,198,255,0)");
    c.fillStyle = g;
    c.filter = "blur(14px)"; c.globalAlpha = 0.6; c.fillRect(0, 52, W, 16);
    c.filter = "blur(1.2px)"; c.globalAlpha = 1; c.fillRect(0, 59, W, 2); }
  // film grain (seeded, so every render is identical)
  const rnd = mulberry32(20261107);
  const gw = Math.ceil(W / GRAIN_SCALE) + 64, gh = Math.ceil(H / GRAIN_SCALE) + 64;
  for (let k = 0; k < 14; k++) {
    const c = mk(gw, gh), cc = c.getContext("2d"), id = cc.createImageData(gw, gh), d = id.data;
    for (let p = 0; p < d.length; p += 4) {
      const v = ((rnd() + rnd() + rnd()) / 3) * 255;
      d[p] = d[p + 1] = d[p + 2] = v; d[p + 3] = 255;
    }
    cc.putImageData(id, 0, 0); grain.push(c);
  }
  sweepCv = mk(W, H); sctx = sweepCv.getContext("2d");
}

/* ---------- scenes ---------- */
function logoY(t) { return lerp(CY, CY - 40, easeInOutCubic(prog(t, T.logoRise, T.logoRise + 1.1))); }

// 1. A hairline grows out of the dark, then splits open like a slit.
function sceneLine(c, t) {
  if (t < T.lineStart || t > T.hit1 + 1.4) return;
  const grow = easeInOutCubic(prog(t, T.lineStart, T.hit1 - 0.04));
  const flick = t < T.hit1 ? 0.88 + 0.12 * wobble(t * 31) : 1;
  const pre = 0.5 + 0.5 * easeInCubic(prog(t, T.lineStart, T.hit1));
  const open = easeOutExpo(prog(t, T.hit1, T.hit1 + 0.9));
  const fade = 1 - easeInOutCubic(prog(t, T.hit1 + 0.45, T.hit1 + 1.35));
  const halfW = lerp(1, 380, grow);
  const gap = open * 60;
  const y = logoY(t);
  const a = pre * flick * fade;
  if (gap < 0.6) hLine(c, CX, y, halfW, 1.6, a);
  else { hLine(c, CX, y - gap, halfW, 1.3, a); hLine(c, CX, y + gap, halfW, 1.3, a); }
}

// 2. YEMELBAI FILMS — revealed through the slit, slow tracking, then disperses.
function sceneLogo(c, t) {
  if (t < T.hit1 || t > T.logoGone) return;
  const ly = logoY(t);
  const out = prog(t, T.logoOut, T.logoGone), outE = easeInCubic(out);
  const fadeAll = 1 - easeInQuad(out);
  const outBlur = outE * 12;
  const size = STUDIO.size;
  const track = lerp(0.68, 0.5, easeOutCubic(prog(t, T.hit1, T.logoOut))) * size + outE * 0.55 * size;

  c.save();
  if (t < T.hit1 + 0.9) {   // slit mask
    const gap = easeOutExpo(prog(t, T.hit1, T.hit1 + 0.9)) * 60;
    c.beginPath(); c.rect(0, ly - gap, W, gap * 2); c.clip();
  }
  const logoW = drawTracked(c, T.studio, STUDIO.weight, size, track, CX, ly, fadeAll, (i, n) => {
    const d = Math.abs(i - (n - 1) / 2) / ((n - 1) / 2);
    const p = easeOutCubic(prog(t, T.hit1 + d * 0.18, T.hit1 + 0.75 + d * 0.18));
    return { blur: (1 - p) * 9 + outBlur, alpha: 0.3 + 0.7 * p };
  });
  c.restore();

  // FILMS with side rules
  const fp = easeOutCubic(prog(t, T.filmsIn, T.filmsIn + 0.9));
  const fsize = 19;
  const fy = ly + 56 + (1 - fp) * 10;
  const ftrack = lerp(1.3, 0.95, easeOutCubic(prog(t, T.filmsIn, T.logoOut))) * fsize + outE * 0.7 * fsize;
  const fw = drawTracked(c, T.studioSub, 300, fsize, ftrack, CX, fy, fp * fadeAll, () => ({ blur: (1 - fp) * 6 + outBlur }));
  const rp = easeInOutCubic(prog(t, T.filmsIn + 0.15, T.filmsIn + 1.15));
  const inner = fw / 2 + 26, outer = Math.max(inner, logoW / 2);
  const len = (outer - inner) * rp;
  if (len > 0.5) {
    c.save(); c.globalAlpha = 0.5 * fadeAll; c.fillStyle = INK;
    if (outBlur > 0.1) c.filter = `blur(${outBlur.toFixed(2)}px)`;
    c.fillRect(CX - inner - len, fy - 0.5, len, 1);
    c.fillRect(CX + inner, fy - 0.5, len, 1);
    c.restore();
  }
  // ҰСЫНАДЫ (presents)
  const pp = easeOutCubic(prog(t, T.presentsIn, T.presentsIn + 1.0));
  const psize = 14;
  drawTracked(c, T.presents, 300, psize, (0.85 + 0.15 * pp) * psize + outE * 0.6 * psize,
    CX, ly + 122, 0.55 * pp * fadeAll, () => ({ blur: (1 - pp) * 5 + outBlur }));
}

/* ---------- VeoSeeBot logo: vector outlines traced from the supplied artwork (assets/logo.js) ---------- */
const S = T.logoScale;                  // source-image px -> screen px
const LG = {};                          // star / word / tag: { box, w, h, k, items: [{ path, x, y, w, h }] }
let SRC_CX, SRC_CY, STAR_C, STAR_R, STAR_TOP, TAG_BOTTOM, WORD_FLOOR, WORD_W, starCv, starCtx;

function partOrigin(P) { return [CX + (P.box[0] - SRC_CX) * S, CY + (P.box[1] - SRC_CY) * S]; }
// screen-space vertical centre / bottom of one traced path (potrace paths are y-up inside their crop)
const itemTop = (P, it) => partOrigin(P)[1] + (P.h - it.y - it.h) * P.k;
const itemBottom = (P, it) => partOrigin(P)[1] + (P.h - it.y) * P.k;
const itemCX = (P, it) => partOrigin(P)[0] + (it.x + it.w / 2) * P.k;

function buildLogo() {
  const L = window.LOGO, NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("style", "position:absolute;left:-10000px;top:0;width:10px;height:10px");
  document.body.appendChild(svg);
  for (const [name, part] of Object.entries(L.parts)) {
    const items = part.paths.map(d => {
      const el = document.createElementNS(NS, "path"); el.setAttribute("d", d); svg.appendChild(el);
      const b = el.getBBox();
      return { path: new Path2D(d), x: b.x, y: b.y, w: b.width, h: b.height };
    });
    items.sort((a, b) => a.x - b.x);
    LG[name] = { box: part.box, w: part.w, h: part.h, k: S / L.scale, items };
  }
  svg.remove();
  SRC_CX = (LG.star.box[0] + LG.star.box[2]) / 2;
  SRC_CY = (LG.star.box[1] + LG.tag.box[3]) / 2;
  const so = partOrigin(LG.star);
  STAR_C = [so[0] + LG.star.w * LG.star.k / 2, so[1] + LG.star.h * LG.star.k / 2];
  STAR_R = Math.hypot(LG.star.w, LG.star.h) * LG.star.k / 2;
  STAR_TOP = Math.min(...LG.star.items.map(it => itemTop(LG.star, it)));
  TAG_BOTTOM = Math.max(...LG.tag.items.map(it => itemBottom(LG.tag, it)));
  WORD_FLOOR = Math.max(...LG.word.items.map(it => itemBottom(LG.word, it))) + 1;
  const wx = LG.word.items.map(it => itemCX(LG.word, it));
  WORD_W = (Math.max(...LG.word.items.map(it => partOrigin(LG.word)[0] + (it.x + it.w) * LG.word.k))
          - Math.min(...LG.word.items.map(it => partOrigin(LG.word)[0] + it.x * LG.word.k)));
  starCv = mk(Math.ceil(STAR_R * 2 + 80), Math.ceil(STAR_R * 2 + 80));
  starCtx = starCv.getContext("2d");
}
function fillItem(c, P, it) {
  const [ox, oy] = partOrigin(P);
  c.save(); c.translate(ox, oy + P.h * P.k); c.scale(P.k, -P.k); c.fill(it.path, "evenodd"); c.restore();
}

// 3. A single point of light — the centre of the future aperture — pulses and sends out rings.
function scenePing(c, t) {
  if (t < T.dotIn || t > T.hit2 + 2.6) return;
  const [x, y] = STAR_C;
  let beat = 0;
  for (let n = 0; n < T.pingCount; n++) beat += Math.pow(0.62, n) * pulse(t, T.ping + n * T.pingInterval, 0.11);
  const dIn = easeOutCubic(prog(t, T.dotIn, T.dotIn + 0.5));
  const dOut = 1 - prog(t, T.hit2 - 0.05, T.hit2 + 0.12);
  dot(c, x, y, 2.6 + 2.6 * beat, dIn * dOut * (0.7 + 0.3 * Math.min(1, beat)));
  const ringFade = 1 - 0.6 * easeInQuad(prog(t, T.drawStart, T.hit2)) - 0.4 * prog(t, T.hit2, T.hit2 + 0.3);
  for (let n = 0; n < T.pingCount; n++) {
    const t0 = T.ping + n * T.pingInterval, p = prog(t, t0, t0 + 2.4);
    if (p <= 0 || p >= 1) continue;
    ring(c, x, y, 6 + 680 * (1 - Math.pow(1 - p, 1.7)), 1.7 - 0.9 * p, 0.6 * Math.pow(0.68, n) * Math.pow(1 - p, 1.4) * ringFade);
  }
}

// The star: a light pen traces its outline while it turns like an aperture ring,
// then on the hit it locks and the fill opens from the centre like an iris.
function starState(t) {
  const p = prog(t, T.drawStart, T.hit2), after = t - T.hit2;
  const spring = after > 0 ? Math.exp(-after / 0.16) * Math.sin(after * 2 * Math.PI * 3.2) : 0;
  return {
    rot: after < 0 ? -0.8 * (1 - easeInOutCubic(p) * 0.35 - 0.65 * p) : 0.045 * spring,
    sc: after < 0 ? lerp(0.86, 1, easeInQuad(p)) : 1 + 0.03 * spring,
    sweep: easeInOutCubic(prog(t, T.drawStart, T.hit2 - 0.1)),
    outlineA: t < T.drawStart ? 0 : 1 - prog(t, T.hit2 - 0.02, T.hit2 + 0.3),
    iris: easeOutExpo(prog(t, T.hit2 - 0.03, T.hit2 + 0.5)),
  };
}
function paintStar(t) {
  const st = starState(t), c = starCtx, n = starCv.width, P = LG.star, k = P.k;
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = "source-over"; c.globalAlpha = 1; c.filter = "none";
  c.clearRect(0, 0, n, n);
  if (st.outlineA <= 0.002 && st.iris <= 0) return st;
  const toStar = () => { c.translate(n / 2, n / 2); c.rotate(st.rot); c.scale(st.sc * k, -st.sc * k); c.translate(-P.w / 2, -P.h / 2); };
  if (st.outlineA > 0.002) {
    c.save(); toStar();
    c.globalAlpha = st.outlineA; c.strokeStyle = INK; c.lineJoin = "round"; c.lineWidth = 1.7 / (k * st.sc);
    for (const it of P.items) c.stroke(it.path);
    c.restore();
    if (st.sweep < 1) {           // only the part the pen has already passed is visible
      const g = c.createConicGradient(-Math.PI / 2 + st.rot, n / 2, n / 2);
      const hi = clamp(st.sweep, 0.001, 0.999), lo = Math.max(0.0005, hi - 0.05);
      g.addColorStop(0, "#000"); g.addColorStop(lo, "#000"); g.addColorStop(hi, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,0)");
      c.globalCompositeOperation = "destination-in"; c.fillStyle = g; c.fillRect(0, 0, n, n);
      c.globalCompositeOperation = "source-over";
    }
  }
  if (st.iris > 0) {
    c.save();
    c.beginPath(); c.arc(n / 2, n / 2, st.iris * n / 2, 0, Math.PI * 2); c.clip();
    toStar(); c.fillStyle = INK;
    for (const it of P.items) c.fill(it.path, "evenodd");
    c.restore();
  }
  return st;
}

// Everything that belongs to the lockup, drawn with the lockup's own camera (push-in, outro squash).
function drawLockup(c, t, vis, plain) {
  const n = starCv.width;
  // star (+ its pen scan line and an impact ghost)
  c.save(); c.globalAlpha = vis; c.drawImage(starCv, STAR_C[0] - n / 2, STAR_C[1] - n / 2); c.restore();
  if (!plain) {
    const st = starState(t);
    if (t > T.drawStart && t < T.hit2) {
      const a = -Math.PI / 2 + st.rot + st.sweep * Math.PI * 2, r = STAR_R * 1.05 * st.sc;
      const g = c.createLinearGradient(STAR_C[0], STAR_C[1], STAR_C[0] + Math.cos(a) * r, STAR_C[1] + Math.sin(a) * r);
      g.addColorStop(0, ink(0)); g.addColorStop(0.55, ink(0.32)); g.addColorStop(1, ink(0));
      c.save(); c.globalAlpha = vis * Math.sin(Math.PI * prog(t, T.drawStart, T.hit2)); c.strokeStyle = g; c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(STAR_C[0], STAR_C[1]); c.lineTo(STAR_C[0] + Math.cos(a) * r, STAR_C[1] + Math.sin(a) * r); c.stroke(); c.restore();
    }
    const gp = prog(t, T.hit2, T.hit2 + 1.1);
    if (gp > 0 && gp < 1) {
      const s = 1 + 0.45 * easeOutCubic(gp);
      c.save(); c.globalAlpha = vis * 0.3 * Math.pow(1 - gp, 1.6); c.filter = `blur(${(gp * 8).toFixed(2)}px)`;
      c.translate(STAR_C[0], STAR_C[1]); c.scale(s, s); c.drawImage(starCv, -n / 2, -n / 2); c.restore();
    }
  }
  // VeoSeeBot — letters rise out of an invisible floor, one after another
  const Wd = LG.word;
  c.save();
  c.beginPath(); c.rect(0, WORD_FLOOR - 600, W, 600); c.clip();
  Wd.items.forEach((it, i) => {
    const s0 = T.wordIn + i * 0.065, e = easeOutCubic(prog(t, s0, s0 + 0.85));
    if (e <= 0) return;
    c.save();
    c.globalAlpha = vis * Math.min(1, e * 1.5); c.fillStyle = INK;
    if (!plain && e < 0.99) c.filter = `blur(${((1 - e) * 5).toFixed(2)}px)`;
    c.translate(0, (1 - e) * (itemBottom(Wd, it) - itemTop(Wd, it)) * 1.2);
    fillItem(c, Wd, it); c.restore();
  });
  c.restore();
  // VSE AI ZDES — letters gather from a wider spacing into place
  const Tg = LG.tag;
  const spread = lerp(1.55, 1, easeOutCubic(prog(t, T.tagIn, T.tagIn + 1.2)));
  const maxD = Math.max(...Tg.items.map(it => Math.abs(itemCX(Tg, it) - CX)));
  for (const it of Tg.items) {
    const dx = itemCX(Tg, it) - CX, d = Math.abs(dx) / maxD;
    const p = easeOutCubic(prog(t, T.tagIn + d * 0.25, T.tagIn + 0.75 + d * 0.25));
    if (p <= 0) continue;
    c.save(); c.globalAlpha = vis * p; c.fillStyle = INK;
    if (!plain && p < 0.99) c.filter = `blur(${((1 - p) * 4).toFixed(2)}px)`;
    c.translate(dx * (spread - 1), 0); fillItem(c, Tg, it); c.restore();
  }
}

// 4. VeoSeeBot lockup with the credit line around it; slow push-in; light sweep; outro fold.
function sceneLockup(c, g, t) {
  if (t < T.drawStart - 0.05 || t > T.lineCollapse + 0.1) return;
  paintStar(t);
  const push = 1 + 0.035 * easeOutCubic(prog(t, T.hit2, T.outro + 0.6));
  const outP = prog(t, T.outro, T.lineCollapse);
  const sy = 1 - 0.992 * easeInCubic(outP);
  const vis = 1 - easeInQuad(prog(outP, 0.82, 1));
  const cam = (cx) => { cx.translate(CX, CY); cx.scale(push, push * sy); cx.translate(-CX, -CY); };

  c.save(); cam(c);
  drawLockup(c, t, vis, false);
  // credit line: «ФИЛЬМ ТОЛЫҚТАЙ» [VeoSeeBot] «ЖИ ПЛАТФОРМАСЫНДА ЖАСАЛДЫ»
  const capFade = 1 - easeInQuad(prog(t, T.outro, T.outro + 0.35));
  const size = 30;
  [[T.captionTop, STAR_TOP - 76, T.captionIn], [T.captionBottom, TAG_BOTTOM + 80, T.captionIn + 0.3]].forEach(([txt, y, t0]) => {
    const e = easeOutCubic(prog(t, t0, t0 + 1.1));
    if (e <= 0) return;
    drawTracked(c, txt, 300, size, lerp(0.7, 0.4, e) * size, CX, y, 0.86 * e * capFade, () => ({ blur: (1 - e) * 5 }));
  });
  c.restore();

  // light sweep across the lockup (feeds the glow, a touch on the sharp layer)
  const sp = prog(t, T.sweep, T.sweep + 1.5);
  if (sp > 0 && sp < 1) {
    sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.globalCompositeOperation = "source-over"; sctx.globalAlpha = 1; sctx.filter = "none";
    sctx.clearRect(0, 0, W, H);
    sctx.save(); cam(sctx); drawLockup(sctx, t, 1, true); sctx.restore();
    sctx.globalCompositeOperation = "source-in";
    const bx = lerp(CX - WORD_W * 0.75, CX + WORD_W * 0.75, easeInOutCubic(sp));
    const gr = sctx.createLinearGradient(bx - 220, CY - 300, bx + 220, CY + 300);
    gr.addColorStop(0, "rgba(255,248,236,0)"); gr.addColorStop(0.5, "rgba(255,248,236,1)"); gr.addColorStop(1, "rgba(255,248,236,0)");
    sctx.fillStyle = gr; sctx.fillRect(0, 0, W, H);
    const env = Math.sin(Math.PI * sp);
    for (const [cv, a] of [[g, 0.9 * env], [c, 0.15 * env]]) {
      cv.save(); cv.setTransform(1, 0, 0, 1, 0, 0); cv.globalCompositeOperation = "lighter"; cv.globalAlpha = a;
      cv.drawImage(sweepCv, 0, 0); cv.restore();
    }
  }
  // impact shock ring
  const rp = prog(t, T.hit2, T.hit2 + 2.0);
  if (rp > 0 && rp < 1) ring(c, STAR_C[0], STAR_C[1], STAR_R * 0.8 + 1000 * easeOutCubic(rp), 2.2 - 1.6 * rp, 0.3 * Math.pow(1 - rp, 1.5) * prog(rp, 0, 0.05));
}

// 5. The lockup folds into the hairline, the line into a point, the point goes dark.
function sceneOutro(c, t) {
  const outP = prog(t, T.outro, T.lineCollapse);
  if (outP > 0.55 && t < T.dotHit + 0.1) {
    const push = 1 + 0.035 * easeOutCubic(prog(t, T.hit2, T.outro + 0.6));
    const shrink = easeInOutCubic(prog(t, T.lineCollapse, T.dotHit));
    const halfW = (WORD_W / 2 + 30) * push * (1 - shrink);
    hLine(c, CX, CY, Math.max(halfW, 3), 1.6, easeInOutCubic(prog(outP, 0.55, 1)) * (1 - prog(t, T.dotHit - 0.05, T.dotHit + 0.05)));
  }
  if (t >= T.dotHit - 0.05) {
    const end = 1 - easeInQuad(prog(t, T.dotHit, T.dotGone));
    dot(c, CX, CY, 2.4 + 3.2 * pulse(t, T.dotHit, 0.12), end * prog(t, T.dotHit - 0.05, T.dotHit));
    const tail = 1 - prog(t, T.dotGone, T.introEnd - 0.15);
    for (let n = 0; n < 3; n++) {
      const t0 = T.dotHit + n * T.echoInterval, p = prog(t, t0, t0 + 1.5);
      if (p <= 0 || p >= 1) continue;
      ring(c, CX, CY, 4 + 420 * (1 - Math.pow(1 - p, 1.8)), 1.4 - 0.7 * p, 0.42 * Math.pow(0.6, n) * Math.pow(1 - p, 1.5) * tail);
    }
  }
}

/* ---------- Ziyo Fest AI: colour vector layers traced from the supplied artwork (assets/ziyo.js) ---------- */
const ZS = T.ziyoScale;
const easeOutQuart = x => 1 - Math.pow(1 - x, 4);
const easeOutBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const ZL = {};                          // teal / gold / text: { color, items: [{ path, x, y, w, h }] }
let ZD, Z_CX, Z_CY, ZF_C, ZF_R, Z_TOP, Z_BASE, Z_TEXT_FLOOR;

const zPt = (sx, sy) => [CX + (sx - Z_CX) * ZS, CY + (sy - Z_CY) * ZS];            // source px -> screen
const zSrc = (it) => ({                                                                // path bbox -> source px
  x0: ZD.box[0] + it.x / ZD.scale, x1: ZD.box[0] + (it.x + it.w) / ZD.scale,
  y0: ZD.box[1] + (ZD.h - it.y - it.h) / ZD.scale, y1: ZD.box[1] + (ZD.h - it.y) / ZD.scale });

function buildZiyo() {
  ZD = window.ZIYO;
  const NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg");
  svg.setAttribute("style", "position:absolute;left:-10000px;top:0;width:10px;height:10px");
  document.body.appendChild(svg);
  for (const [name, L] of Object.entries(ZD.layers)) {
    const items = L.paths.map(d => {
      const el = document.createElementNS(NS, "path"); el.setAttribute("d", d); svg.appendChild(el);
      const b = el.getBBox();
      return { path: new Path2D(d), x: b.x, y: b.y, w: b.width, h: b.height };
    });
    items.sort((a, b) => a.x - b.x);
    ZL[name] = { color: L.color, items };
  }
  svg.remove();
  const all = [...ZL.teal.items, ...ZL.gold.items, ...ZL.text.items].map(zSrc);
  for (const p of ZD.pixels) all.push({ x0: p.cx - p.s / 2, x1: p.cx + p.s / 2, y0: p.cy - p.s / 2, y1: p.cy + p.s / 2 });
  Z_CX = (Math.min(...all.map(b => b.x0)) + Math.max(...all.map(b => b.x1))) / 2;
  Z_CY = (Math.min(...all.map(b => b.y0)) + Math.max(...all.map(b => b.y1))) / 2;
  ZF_C = zPt(ZD.circle.cx, ZD.circle.cy);
  const petals = [...ZL.teal.items, ...ZL.gold.items].map(zSrc);
  ZF_R = Math.max(...petals.map(b => Math.max(Math.hypot(b.x0 - ZD.circle.cx, b.y0 - ZD.circle.cy),
                                             Math.hypot(b.x1 - ZD.circle.cx, b.y1 - ZD.circle.cy)))) * ZS;
  Z_TOP = zPt(0, Math.min(...petals.map(b => b.y0)))[1];
  const bottoms = ZL.text.items.map(it => zSrc(it).y1).sort((a, b) => a - b);
  Z_BASE = zPt(0, bottoms[Math.floor(bottoms.length / 2)])[1];                       // baseline (median bottom)
  Z_TEXT_FLOOR = zPt(0, bottoms[bottoms.length - 1])[1] + 1;                          // lowest point (the y)
}
function zFill(c, it) {
  c.save();
  c.translate(CX + (ZD.box[0] - Z_CX) * ZS, CY + (ZD.box[1] - Z_CY) * ZS + ZD.h * ZS / ZD.scale);
  c.scale(ZS / ZD.scale, -ZS / ZD.scale);
  c.fill(it.path, "evenodd"); c.restore();
}

function ziyoState(t) {
  const p = prog(t, T.zSpin, T.zHit), after = t - T.zHit, e = easeOutQuart(p);
  const spring = after > 0 ? Math.exp(-after / 0.18) * Math.sin(after * 2 * Math.PI * 2.6) : 0;
  return {
    rotTeal: after < 0 ? 1.15 * (1 - e) : 0.035 * spring,     // the two colours turn against each other,
    rotGold: after < 0 ? -1.15 * (1 - e) : -0.035 * spring,   // like the blades of an aperture closing in
    sc: after < 0 ? lerp(0.5, 1, easeOutCubic(p)) : 1 + 0.025 * spring,
    a: easeOutCubic(prog(t, T.zSpin, T.zSpin + 0.55)),
    blur: (1 - easeOutCubic(prog(t, T.zSpin, T.zHit - 0.1))) * 9,
    iris: easeOutExpo(prog(t, T.zHit - 0.03, T.zHit + 0.45)),
  };
}

function drawZiyo(c, t, vis, plain, extraBlur) {
  const st = ziyoState(t);
  const fb = plain ? 0 : st.blur + extraBlur;
  for (const [name, rot] of [["teal", st.rotTeal], ["gold", st.rotGold]]) {
    c.save();
    c.globalAlpha = vis * st.a; c.fillStyle = ZL[name].color;
    if (fb > 0.08) c.filter = `blur(${fb.toFixed(2)}px)`;
    c.translate(ZF_C[0], ZF_C[1]); c.rotate(rot); c.scale(st.sc, st.sc); c.translate(-ZF_C[0], -ZF_C[1]);
    for (const it of ZL[name].items) zFill(c, it);
    c.restore();
  }
  // white centre opens like an iris on the hit
  if (st.iris > 0) {
    c.save(); c.globalAlpha = vis; c.fillStyle = "#fbfaf7";
    if (!plain && extraBlur > 0.08) c.filter = `blur(${extraBlur.toFixed(2)}px)`;
    c.beginPath(); c.arc(ZF_C[0], ZF_C[1], ZD.circle.r * ZS * st.sc * st.iris, 0, Math.PI * 2); c.fill(); c.restore();
  }
  // digital pixels fly out along their trail, one by one
  const px = ZD.pixels, anchor = zPt(px[0].cx, px[0].cy);
  px.forEach((p, i) => {
    const q = prog(t, T.zPixels + i * 0.075, T.zPixels + i * 0.075 + 0.55);
    if (q <= 0) return;
    const [fx, fy] = zPt(p.cx, p.cy), m = easeOutCubic(q);
    const x = lerp(anchor[0], fx, m), y = lerp(anchor[1], fy, m), s = p.s * ZS * Math.max(0, easeOutBack(q));
    c.save(); c.globalAlpha = vis * Math.min(1, q * 3); c.fillStyle = ZL.gold.color;
    if (!plain && extraBlur > 0.08) c.filter = `blur(${extraBlur.toFixed(2)}px)`;
    c.fillRect(x - s / 2, y - s / 2, s, s); c.restore();
  });
  // Ziyo Fest AI — letters rise out of an invisible floor
  c.save();
  c.beginPath(); c.rect(0, Z_TEXT_FLOOR - 500, W, 500); c.clip();
  ZL.text.items.forEach((it, i) => {
    const s0 = T.zWordIn + i * 0.055, e = easeOutCubic(prog(t, s0, s0 + 0.8));
    if (e <= 0) return;
    const b = zSrc(it);
    c.save(); c.globalAlpha = vis * Math.min(1, e * 1.5); c.fillStyle = INK;
    const lb = (plain ? 0 : (1 - e) * 5) + (plain ? 0 : extraBlur);
    if (lb > 0.08) c.filter = `blur(${lb.toFixed(2)}px)`;
    c.translate(0, (1 - e) * Math.max((b.y1 - b.y0) * ZS * 1.2, 70));
    zFill(c, it); c.restore();
  });
  c.restore();
}

// 6. «ФИЛЬМ АРНАЙЫ» [Ziyo Fest AI] «ҮШІН ЖАСАЛДЫ» — continues straight after the intro.
function sceneZiyo(c, g, t) {
  if (t < T.zSpin - 0.05 || t > T.zGone + 0.05) return;
  const out = prog(t, T.zOut, T.zGone), outE = easeInCubic(out);
  const vis = 1 - easeInQuad(out);
  const zoom = (1 + 0.03 * easeOutCubic(prog(t, T.zHit, T.zOut))) * (1 + 0.05 * outE);
  const cam = (cx) => { cx.translate(CX, CY); cx.scale(zoom, zoom); cx.translate(-CX, -CY); };

  c.save(); cam(c);
  drawZiyo(c, t, vis, false, outE * 10);
  // impact ghost: one expanding copy of the flower
  const gp = prog(t, T.zHit, T.zHit + 1.1);
  if (gp > 0 && gp < 1) {
    const s = 1 + 0.35 * easeOutCubic(gp);
    c.save(); c.globalAlpha = 0.28 * Math.pow(1 - gp, 1.6); c.filter = `blur(${(gp * 9).toFixed(2)}px)`;
    c.translate(ZF_C[0], ZF_C[1]); c.scale(s, s); c.translate(-ZF_C[0], -ZF_C[1]);
    for (const name of ["teal", "gold"]) { c.fillStyle = ZL[name].color; for (const it of ZL[name].items) zFill(c, it); }
    c.restore();
  }
  // credit line
  const size = 30;
  [[T.ziyoTop, Z_TOP - 76, T.zCaptionIn], [T.ziyoBottom, Z_BASE + 92, T.zCaptionIn + 0.3]].forEach(([txt, y, t0]) => {
    const e = easeOutCubic(prog(t, t0, t0 + 1.1));
    if (e <= 0) return;
    drawTracked(c, txt, 300, size, lerp(0.7, 0.4, e) * size, CX, y, 0.86 * e * vis, () => ({ blur: (1 - e) * 5 + outE * 10 }));
  });
  c.restore();

  // light sweep across the logo
  const sp = prog(t, T.zSweep, T.zSweep + 1.5);
  if (sp > 0 && sp < 1) {
    sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.globalCompositeOperation = "source-over"; sctx.globalAlpha = 1; sctx.filter = "none";
    sctx.clearRect(0, 0, W, H);
    sctx.save(); cam(sctx); drawZiyo(sctx, t, 1, true, 0); sctx.restore();
    sctx.globalCompositeOperation = "source-in";
    const bx = lerp(CX - ZF_R * 1.3, CX + ZF_R * 1.3, easeInOutCubic(sp));
    const gr = sctx.createLinearGradient(bx - 220, CY - 300, bx + 220, CY + 300);
    gr.addColorStop(0, "rgba(255,248,236,0)"); gr.addColorStop(0.5, "rgba(255,248,236,1)"); gr.addColorStop(1, "rgba(255,248,236,0)");
    sctx.fillStyle = gr; sctx.fillRect(0, 0, W, H);
    const env = Math.sin(Math.PI * sp);
    for (const [cv, a] of [[g, 0.5 * env], [c, 0.07 * env]]) {
      cv.save(); cv.setTransform(1, 0, 0, 1, 0, 0); cv.globalCompositeOperation = "lighter"; cv.globalAlpha = a;
      cv.drawImage(sweepCv, 0, 0); cv.restore();
    }
  }
  // impact shock ring
  const rp = prog(t, T.zHit, T.zHit + 2.0);
  if (rp > 0 && rp < 1) ring(c, ZF_C[0], ZF_C[1], ZF_R * 0.9 + 950 * easeOutCubic(rp), 2.2 - 1.6 * rp, 0.28 * Math.pow(1 - rp, 1.5) * prog(rp, 0, 0.05));
}

/* ---------- frame ---------- */
function render(t) {
  const frame = Math.round(t * T.fps);
  const shake = 2.6 * pulse(t, T.hit2, 0.11) + 1.2 * pulse(t, T.hit1, 0.09) + 2.0 * pulse(t, T.zHit, 0.11);
  const sx = shake * wobble(t * 97), sy = shake * wobble(t * 89 + 4.1);

  for (const c of [lctx, gctx]) { c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, W, H); c.translate(sx, sy); }
  sceneLine(lctx, t);
  sceneLogo(lctx, t);
  scenePing(lctx, t);
  sceneLockup(lctx, gctx, t);
  sceneOutro(lctx, t);
  sceneZiyo(lctx, gctx, t);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1; ctx.filter = "none";
  ctx.drawImage(bg, 0, 0);

  const amb = 0.25 * pulse(t, T.hit1, 0.7) + 0.35 * pulse(t, T.hit2, 1.0) + 0.2 * pulse(t, T.dotHit, 0.5) + 0.3 * pulse(t, T.zHit, 0.9)
            + 0.12 * Math.sin(Math.PI * prog(t, T.sweep, T.sweep + 1.5));
  ctx.globalCompositeOperation = "lighter";
  if (amb > 0.003) { ctx.globalAlpha = Math.min(1, amb); ctx.drawImage(ambient, 0, 0); }

  // bloom (computed at half resolution)
  hctx.globalCompositeOperation = "source-over"; hctx.filter = "none"; hctx.clearRect(0, 0, W / 2, H / 2);
  hctx.drawImage(layer, 0, 0, W / 2, H / 2);
  hctx.globalCompositeOperation = "lighter"; hctx.drawImage(glowSrc, 0, 0, W / 2, H / 2);
  // the colour logo keeps its brand colours: much less bloom on it than on the white marks
  const zCalm = t >= T.introEnd ? 1 : 0;
  const wide = (zCalm ? 0.07 : lerp(0.45, 0.26, prog(t, T.hit2, T.hit2 + 1))) + 0.7 * pulse(t, T.hit1, 0.5) + 0.85 * pulse(t, T.hit2, 0.7) + 0.8 * pulse(t, T.dotHit, 0.4) + 0.6 * pulse(t, T.zHit, 0.45)
             + 0.5 * easeInCubic(prog(t, T.outro, T.lineCollapse)) * (1 - prog(t, T.dotHit, T.dotGone));
  const tight = (zCalm ? 0 : lerp(0.35, 0.08, prog(t, T.hit2, T.hit2 + 1))) + 0.5 * pulse(t, T.hit2, 0.35) + 0.3 * pulse(t, T.hit1, 0.3) + 0.25 * pulse(t, T.zHit, 0.25);
  for (const [r, a] of [[16, wide], [4, tight]]) {
    hbctx.globalCompositeOperation = "source-over"; hbctx.clearRect(0, 0, W / 2, H / 2);
    hbctx.filter = `blur(${r}px)`; hbctx.drawImage(half, 0, 0); hbctx.filter = "none";
    let left = a;
    while (left > 0.003) { ctx.globalAlpha = Math.min(1, left); ctx.drawImage(halfB, 0, 0, W, H); left -= 1; }
  }

  // sharp layer, with chromatic split on impacts
  const ca = 5.5 * pulse(t, T.hit2, 0.15) + 4 * pulse(t, T.hit1, 0.14) + 3 * pulse(t, T.dotHit, 0.12) + 5 * pulse(t, T.zHit, 0.15);
  ctx.globalAlpha = 1;
  if (ca < 0.35) ctx.drawImage(layer, 0, 0);
  else {
    for (const [col, dx] of [["#f00", -ca], ["#0f0", 0], ["#00f", ca]]) {    // split into R, G, B and offset
      tctx.globalCompositeOperation = "source-over"; tctx.clearRect(0, 0, W, H);
      tctx.drawImage(layer, dx, 0);
      tctx.globalCompositeOperation = "multiply"; tctx.fillStyle = col; tctx.fillRect(0, 0, W, H);
      tctx.globalCompositeOperation = "destination-in"; tctx.drawImage(layer, dx, 0);
      ctx.drawImage(tint, 0, 0);
    }
  }

  // anamorphic streak
  const sa = 0.08 * easeInCubic(prog(t, T.lineStart, T.hit1)) * (t < T.hit1 ? 1 : 0)
           + 0.6 * pulse(t, T.hit1, 0.35) + 0.85 * pulse(t, T.hit2, 0.5) + 0.5 * pulse(t, T.dotHit, 0.35) + 0.75 * pulse(t, T.zHit, 0.45);
  if (sa > 0.003) {
    const sxs = 0.75 + 0.25 * Math.min(1, sa);
    ctx.globalAlpha = Math.min(1, sa);
    const yy = (t >= T.introEnd ? ZF_C[1] : t < T.hit2 ? logoY(t) : t < T.dotHit - 0.1 ? STAR_C[1] : CY) + sy;
    ctx.drawImage(streak, CX - W * sxs / 2 + sx, yy - 60, W * sxs, 120);
  }

  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  ctx.drawImage(vignette, 0, 0);

  // film grain
  const gr = mulberry32(frame * 7919 + 13);
  const gi = Math.floor(gr() * grain.length), gj = (gi + 1 + Math.floor(gr() * (grain.length - 1))) % grain.length;
  const ox = Math.floor(gr() * 64), oy = Math.floor(gr() * 64);
  ctx.imageSmoothingEnabled = true;
  const gs = GRAIN_SCALE;
  ctx.globalCompositeOperation = "screen"; ctx.globalAlpha = 0.022;
  ctx.drawImage(grain[gi], -ox * gs, -oy * gs, grain[gi].width * gs, grain[gi].height * gs);
  ctx.globalCompositeOperation = "overlay"; ctx.globalAlpha = 0.09;
  ctx.drawImage(grain[gj], -oy * gs, -ox * gs, grain[gj].width * gs, grain[gj].height * gs);
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;

  // fade from / to pure black at the very edges of the clip
  const edge = Math.max(1 - prog(t, 0, 0.35), prog(t, T.duration - 0.25, T.duration));
  if (edge > 0) { ctx.globalAlpha = edge; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

/* ---------- boot ---------- */
async function boot() {
  await Promise.all([
    document.fonts.load(font(600, 64), T.studio),
    document.fonts.load(font(300, 19), T.studioSub + T.presents),
    document.fonts.load(font(300, 30), T.captionTop + T.captionBottom + T.ziyoTop + T.ziyoBottom),
  ]);
  buildAssets();
  buildLogo();
  buildZiyo();
  window.renderFrame = (i) => { render(i / T.fps); return canvas.toDataURL("image/png"); };
  window.frameCount = Math.round(T.duration * T.fps);
  render(0);
  window.introReady = true;
  if (!RENDER) startPreview();
}

function startPreview() {
  document.body.classList.add("preview");
  const snd = document.getElementById("snd"), fill = document.getElementById("fill"), tc = document.getElementById("tc");
  let playing = false, hasAudio = false, t0 = 0, base = 0;
  snd.addEventListener("canplaythrough", () => hasAudio = true, { once: true });
  const now = () => playing ? (hasAudio ? snd.currentTime : base + (performance.now() - t0) / 1000) : base;
  function toggle() {
    if (playing) { base = now(); playing = false; snd.pause(); return; }
    if (base >= T.duration - 0.05) base = 0;
    playing = true; t0 = performance.now();
    if (hasAudio) { snd.currentTime = base; snd.play().catch(() => hasAudio = false); }
  }
  function seek(t) { base = clamp(t, 0, T.duration); t0 = performance.now(); if (hasAudio) snd.currentTime = base; }
  canvas.addEventListener("click", toggle);
  addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); toggle(); } });
  document.getElementById("bar").addEventListener("click", e => {
    const r = e.currentTarget.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * T.duration);
  });
  (function loop() {
    let t = now();
    if (t >= T.duration) { t = T.duration; base = t; playing = false; snd.pause(); }
    render(t);
    fill.style.width = (t / T.duration * 100) + "%"; tc.textContent = t.toFixed(2);
    requestAnimationFrame(loop);
  })();
}
boot();
</script>
</body>
</html>
