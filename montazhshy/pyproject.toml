[project]
name = "montazhshy"
version = "1.0.0"
description = "Монтажшы — кәсіби видеомонтаж жасайтын ЖИ агенті (Claude + FFmpeg)"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.0,<3", "numpy>=1.24", "Pillow>=10.1"]

[project.scripts]
montazhshy = "montazhshy.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
