# «Монтажшы» ЖИ агентінің тесттері (FFmpeg + синтетикалық медиа).
name: Montazhshy tests

on:
  push:
    paths:
      - "montazhshy/**"
      - ".github/workflows/montazhshy-tests.yml"
  pull_request:
    paths:
      - "montazhshy/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: montazhshy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
