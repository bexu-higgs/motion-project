services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mafia
      POSTGRES_PASSWORD: mafia
      POSTGRES_DB: mafia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mafia -d mafia"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
